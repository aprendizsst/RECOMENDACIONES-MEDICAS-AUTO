<!DOCTYPE html>
<html>
<head><base target="_top"><meta charset="UTF-8"><title>Portal SST Backend</title></head>
<body>
<script>
(() => {
  let parentOrigin = '*';
  function send(message) {
    try { parent.postMessage(Object.assign({ channel: 'sst-backend' }, message), parentOrigin || '*'); }
    catch (_) { parent.postMessage(Object.assign({ channel: 'sst-backend' }, message), '*'); }
  }
  window.addEventListener('message', (event) => {
    if (event.source !== parent) return;
    const msg = event.data || {};
    if (msg.channel !== 'sst-frontend' || !msg.id || !msg.action) return;
    parentOrigin = event.origin || '*';
    google.script.run
      .withSuccessHandler((data) => send({ id: msg.id, ok: true, data }))
      .withFailureHandler((error) => send({ id: msg.id, ok: false, error: error && error.message ? error.message : String(error) }))
      .apiDispatch(JSON.stringify(msg));
  });
  send({ type: 'ready' });
  setTimeout(() => send({ type: 'ready' }), 700);
  setTimeout(() => send({ type: 'ready' }), 2200);
})();
</script>
</body>
</html>
